name: Notify biolm-models-mcp on collection update

on:
  push:
    branches: [main]
    paths:
      - 'biolm-public/biolm-public.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: biolm-models-mcp

      - name: Fire repository_dispatch to biolm-models-mcp
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BioLM/biolm-models-mcp/dispatches \
            -d '{"event_type":"postman-collection-updated"}'
